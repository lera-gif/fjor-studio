[project]
name = "fjor-studio"
version = "0.1.0"
description = "The colleague's proven video-ad pipeline behind a producer-facing job engine"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
fjor-studio = "fjor_studio.cli:cli"   # cli() turns a config mistake into a sentence

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fjor_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
