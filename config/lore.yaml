  military:
    anchors:
    - No gym. No excuses.
    - Just your bodyweight and 10 minutes.
    - Discipline over motivation.
    - The plan decides, not your mood.
    - Structure beats willpower.
    - You don't need to be a soldier.
    - Scaled for beginners.
    cast_lock: unlike the other activity verticals this audience can skew MALE or mixed
      — preserve the reference's gender rather than defaulting female. Beginners and 40+
      comeback 35-60, often male-leaning; a women's line 30-55; hardcore 25-45. A veteran
      or ex-military trainer type reads as authority — fit and no-nonsense, never glam
    content_safety: Never claim official affiliation with any real armed force, unit or
      government programme, and never show real insignia or uniforms. "Military-style",
      "inspired by military training" and "boot-camp-style" are fine. Firm coaching is fine;
      abuse, hazing and humiliation are not. Scaling options must be shown for any beginner
      or 40+ creative, and a "consult your doctor" line belongs in the safe zone.
    copy_tone: disciplined coach or veteran trainer — firm, structured, motivating, no-excuses
      but respectful and encouraging. Never abusive, never screaming, never humiliating,
      never gym-bro-macho. A credible been-there authority who believes the viewer can do
      it
    forbidden_lexicon: 'food-as-mechanic; abuse and hazing tone (screaming drill-sergeant
      abuse as the product, ''puke bucket'', humiliation) — firm is not abusive; gym machines
      and barbells, which break the no-gym hook. Intensity words (push, work, sweat) are
      ON-BRAND but CAPPED: never ''to failure'', ''beast mode'', ''no pain no gain'', ''destroy
      yourself'' as the hero promise for a beginner or 40+ audience — injury-coded and it
      repels them'
    forbidden_names: no 'Navy SEAL Extreme Shred'; never a real unit or force name as the
      product (Navy SEALs, Green Berets) — trademark and impersonation risk. 'Military-style',
      'tactical', 'boot-camp-style' are fine. Never combined with the source's product ('Yoga
      Boot Camp', 'Pilates Tactical')
    keep_out_of_negatives: mat, bodyweight, olive/tactical wardrobe, home, garage and outdoor
      settings
    lipsync_swaps: the voice model mangles the jargon — say 'push-ups', 'squats', '10 minutes,
      no rest', 'one round', 'bodyweight only' rather than burpee, AMRAP, EMOM, calisthenics,
      tactical. Keep the jargon visual-only
    locations: home living room or garage with a mat, a backyard, a driveway, a bare room,
      an outdoor park. Utilitarian and no-frills, never a luxe studio
    mechanic: structured bodyweight movement at home — no gym, no equipment, one short session
      a day
    moves: push-ups including knee and incline scaling, squats, lunges, planks, mountain
      climbers, march-in-place, sit-ups. NEVER injury-coded hero stunts (max-effort ballistic
      movements, one-arm push-ups, 'to failure') for a beginner or 40+ sub-vertical. Showing
      the scaling is what makes the no-excuses promise believable
    names:
    - Military Workout
    - Bodyweight Boot Camp
    - 28-Day Military Fitness Challenge
    - Back-in-Ranks Reset
    - The Comeback Drill
    - Discipline Over Motivation
    - The No-Gym Method
    negative_tokens: gym machines, barbells, heavy iron, food as hero prop, brand logos,
      real military insignia or uniform, camo cosplay, drill-sergeant abuse or hazing imagery,
      injury-coded max-effort stunts as hero, fitness-model glam, before-body shaming, pastel
      spa palette
    objections: 'keep verbatim — gym, membership and no-time criticism (''Gym after 40?
      No thanks'', ''memberships I never use''), with the gym kept in BOTH question and
      answer. Vertical-specific: ''I''m too old / out of shape for military training'' (answer:
      beginner-scaled, at your own pace — discipline, not punishment), ''I have bad knees
      or back'' (scaled options plus a disclaimer), ''I don''t have equipment or space'',
      ''I have no discipline'' (answer: that is what the structure is for), ''isn''t this
      just for young soldiers?'''
    palette: grounded and utilitarian — olive/army green, charcoal, sand/khaki, steel grey,
      warm black. High-contrast and confident; avoid pastel-spa palettes and neon gym-bro
      red/black. Real bodies, real sweat, real light
    power_words: discipline, structure, no excuses, earn it, get after it, one round, drill,
      consistency, back in shape, no gym needed, just your bodyweight
    prop_language: a mat, maybe a pull-up bar or a loaded backpack; a bare room, garage
      or yard; stencil type
    wardrobe: 'plain athletic wear; tactical, olive and neutral tones read on-brand (olive
      tee, joggers, plain trainers). Forbidden: glossy fitness-model glam, CrossFit-competition
      kit, actual military uniforms or insignia, camo worn as cosplay. Light tactical cues
      are fine'
  pilates:
    anchors:
    - You don't need to be flexible or coordinated.
    - Just a mat.
    - Just a wall.
    - Low-impact, kind to your joints.
    - Long, lean, and strong.
    - No experience needed.
    - 15 minutes, right in your living room.
    cast_lock: the audience is ~95% female and male models are not used by default. Beginners
      45-65; Seniors 60-75+; Sculpt 30-50; Prenatal 28-40. The house aesthetic is editorial
      — faces are often partially obscured (low bun, three-quarter from behind) in withholding
      concepts
    copy_tone: elegant, precise, calmly authoritative, encouraging — a little more editorial
      than yoga's register, never gym-bro, never condescending
    forbidden_lexicon: '''skinny'' — say long, lean, toned instead; food-as-mechanic; gym-bro
      (reps to failure, burn, shred, beast mode, no pain no gain, PRs, HIIT). NOTE ''core
      / control / sculpt'' is Pilates vocabulary, not gym-bro — keep it'
    forbidden_names: no 'Pilates Power Shred' / 'Extreme Reformer Burn'; never combined
      with the source's product ('Yoga Pilates', 'Mediterranean Pilates'); never mix sub-verticals
      ('Wall Reformer Pilates')
    keep_out_of_negatives: reformer, magic circle, mat, grip-socks
    lipsync_swaps: the voice model mangles the signature terms — say 'the machine' not reformer,
      'small pulses' not the hundred, 'roll up slowly' not roll-up, 'core' not powerhouse,
      'hold and control' not neutral spine. Keep the terms visual-only
    locations: home living room with a mat, an elegant home studio, at the wall for Wall
      Pilates, a clean bright reformer studio, by the window
    mechanic: controlled low-impact movement — mat, wall, or reformer, about fifteen minutes
      a day
    moves: roll-up, bridge, gentle hundred, leg circles, chest lift, cat-cow, the wall series,
      standing roll-down. NEVER teaser, boomerang, control balance or advanced reformer
      tricks as the hero
    names:
    - Pilates for Beginners
    - Wall Pilates
    - 28-Day Pilates Challenge
    - The Pilates Reset
    - The Pilates Method
    - Long, Lean, Strong
    negative_tokens: dumbbells, barbells, treadmill, gym machines, food as hero prop, brand
      logos, advanced Pilates (teaser/boomerang) as hero, fitness-model glam, before-body
      shaming, gym-bro aesthetic, cold blue or neon gym palette
    objections: 'keep verbatim — gym and cardio criticism (''cardio wrecked my knees'',
      ''hours of cardio and nothing changed''), with the gym kept in BOTH question and answer.
      Vertical-specific: ''isn''t Pilates just for dancers / young / flexible people?'',
      ''the reformer or studio is too expensive'' (answer: all you need is a mat, or just
      a wall), ''I''m not coordinated'', ''bad back / bad knees'''
    palette: 'warm cream #F5EFE6, terracotta #C97B5C, sage #9CAF88, warm black #2A2520,
      dusty rose. Editorial and elegant; avoid cold blues, neon, gym black/red, and yellow
      haze'
    power_words: control, core, powerhouse, long lean lines, precision, low-impact, sculpt,
      flat stomach, lengthen and strengthen
    prop_language: mat, reformer, magic circle, grip-socks, studio light
    wardrobe: 'a Pilates set with grip-socks — a signature prop, keep it. Forbidden: gym-bro
      tanks, ''shred'' aesthetic, CrossFit gear. For 45+ real and modest'
  yoga:
    anchors:
    - You don't have to touch your toes.
    - If you can breathe, you can do this.
    - Just ten minutes on the mat.
    - No experience needed.
    - Start on the floor. Or start in a chair.
    cast_lock: real women, not fitness models. Beginners 45-65; Seniors 60-75+; Prenatal
      28-40. Do not youthify for beauty
    copy_tone: warm, calm, encouraging, permission-giving — never a drill sergeant, never
      condescending
    forbidden_lexicon: food-as-mechanic ('eat these 5 foods', 'meal plan', 'caloric deficit');
      gym-bro (reps, sets, burn, shred, crush it, no pain no gain, PRs, beast mode)
    forbidden_names: no 'Yoga Power Blast' / 'Extreme Yoga Shred'; never combined with the
      source's product ('Pilates Yoga', 'Mediterranean Yoga')
    keep_out_of_negatives: mat, block, strap, blanket, bolster
    lipsync_swaps: the voice model mangles Sanskrit — say 'pose' not asana, 'breath' not
      pranayama, 'final rest' not savasana, 'flow' not vinyasa. Keep Sanskrit visual-only,
      never in a spoken line
    locations: living room with a mat, a sunny home studio, a bedroom by the window, a wooden
      deck or garden, a quiet corner. The mat stays almost always
    mechanic: gentle movement on the mat — achievable poses and flows, about ten minutes
      a day
    moves: mountain, cat-cow, seated forward fold with bent knees, child's pose, chair-supported
      poses, gentle twist, warrior. NEVER inversions or arm balances as the hero — for a
      beginner or 45+ audience it kills trust
    names:
    - Yoga for Beginners
    - 30-Day Yoga Challenge
    - 7-Day Yoga Reset
    - Morning Yoga Reset
    - Gentle Yoga Flow
    - Yoga for a Body That's Changed
    negative_tokens: gym equipment, dumbbells, barbells, treadmill, food as hero prop, brand
      logos, advanced/inversion/pretzel yoga poses, fitness-model glam, before-body shaming,
      gym-bro aesthetic, Sanskrit text on screen
    objections: 'keep verbatim — gym and hard-training criticism (''Gym after 45? No thanks'',
      ''cardio wrecked my knees''), with the gym kept in BOTH question and answer. Vertical-specific:
      ''I''m too stiff / not flexible enough'' (the #1 barrier), ''I''m too old'', ''I''ll
      hurt myself / bad back / bad knees'', ''I can''t get down on or up off the floor''
      (answer with chair yoga), ''no time'' (seven to ten minutes), ''I tried yoga once
      and felt lost'''
    palette: calm wellness — sage, oat, terracotta, cream. Real bodies, real light, no yellow
      haze
    power_words: gentle, looser, stronger, calmer, steady, moves without pain, no experience
      needed, ten minutes, on the mat
    prop_language: mat, block, strap, blanket, bolster, morning light
    wardrobe: 'leggings, a set, loungewear — the norm and needed here. Forbidden: gym-bro
      tanks, ''shred'' aesthetic, CrossFit gear. For 45+ keep it real and modest, like the
      viewer''s own'
  yoga_men:
    anchors:
    - You don't need to be flexible. That's the point.
    - Ten minutes on the floor, before the day starts.
    - If you can breathe, you can do this.
    - No chanting. No incense. Just the stretch.
    - Built for stiff hips and a locked-up lower back.
    - You can do the whole thing in shorts and a t-shirt.
    cast_lock: 'MEN — this is the exception to the house default. Real men, not fitness
      models: 35-55 desk-and-family builds for the mobility angle, 55-70 for the stiffness-and-balance
      angle. Ordinary bodies, some carrying weight, some grey. Never a shirtless athlete,
      never a yoga influencer'
    content_safety: 'Movement for mobility and comfort, never treatment: "helps you move
      easier", "loosens up", "supports mobility" — never "fixes your back", "cures sciatica",
      "realigns your spine" or any claim about a disc, a nerve or an injury. Anyone describing
      real back pain is answered with "talk to your doctor or physio" alongside the gentle
      option. No shame about weight, stiffness or age, and no implication that a man doing
      yoga is unusual or brave — that framing is the insult this vertical exists to avoid.'
    copy_tone: plain, practical, matter-of-fact and a bit dry. Talks to him like a capable
      adult with a stiff back, never like a beginner who needs coaxing. No mysticism, no
      drill sergeant, no jokes at his expense
    forbidden_lexicon: 'gym-bro (reps, sets, burn, shred, crush it, no pain no gain, PRs,
      beast mode) — the audience is escaping that register, not looking for it. Also forbidden:
      the spa-wellness register that reads as not-for-him (goddess, sacred, feminine energy,
      glow, yoni, moon cycle); food-as-mechanic; and any joke at his expense about being
      bad at yoga'
    forbidden_names: no 'Broga', 'Man Flow', 'Yoga Shred', 'Warrior Beast' or any name that
      treats a man doing yoga as a joke or a dare; never combined with the source's product
      ('Pilates Yoga', 'Keto Yoga'); no 'Extreme'/'Blast'
    hook_note: STIFFNESS-FIRST — open on the body complaint (a back that will not loosen,
      hips locked from sitting, bending down and feeling it), never on yoga itself. Naming
      yoga in the first line is what loses this audience
    keep_out_of_negatives: mat, block, towel, t-shirt, shorts
    lipsync_swaps: the voice model mangles Sanskrit and it is wrong for this register anyway
      — say 'pose' not asana, 'breath' not pranayama, 'final rest' not savasana, 'flow'
      not vinyasa. Keep Sanskrit out of spoken lines entirely
    locations: a plain living room with a mat, a garage or home gym corner with the weights
      clearly NOT in use, a bedroom floor at first light, a back garden or deck. Ordinary
      rooms, lived-in, no studio polish
    mechanic: gentle movement on the mat, built for stiff bodies — achievable poses and
      simple flows, about ten minutes a day
    moves: cat-cow, world's greatest stretch, low lunge, figure-four, seated forward fold
      with BENT knees, thoracic rotation, child's pose, standing hamstring hinge, 90/90
      hips. NEVER inversions, arm balances, splits or deep backbends as the hero — for a
      stiff beginner it kills trust instantly
    names:
    - Yoga for Men
    - Yoga for Stiff Guys
    - 30-Day Mobility Challenge
    - The Morning Mobility Reset
    - 10-Minute Yoga for Men
    - Yoga for Bad Backs
    negative_tokens: gym equipment in use, dumbbells, barbells, treadmill, food as hero
      prop, brand logos, advanced/inversion/pretzel poses, shirtless glam, fitness-model
      physique, incense, candles, Sanskrit text on screen, lotus and mandala graphics, before-body
      shaming, gym-bro aesthetic
    objections: 'keep verbatim — the gym and hard-training criticism carries over (''lifting
      wrecked my shoulders'', ''cardio killed my knees''), gym kept in BOTH question and
      answer. Vertical-specific and load-bearing: ''yoga isn''t for men'' (the #1 barrier
      — answer on mobility and pain, never on spirituality), ''I''m the least flexible person
      alive'', ''I''d feel stupid in a class'' (answer: this is at home, nobody is watching),
      ''I''m too heavy to get on the floor'', ''my back is already bad'', ''I don''t have
      time'''
    palette: muted and unfussy — slate, olive, warm grey, oat, dark denim blue. Natural
      window light. Avoid the pastel wellness palette, avoid candle-lit spa styling, avoid
      yellow haze
    power_words: stiff, tight hips, locked-up back, mobility, range of motion, loosen up,
      move without pain, ten minutes, no flexibility needed, straighten up, sleep better
    prop_language: mat, a block used as a prop for stiff hips, a folded towel, a water glass,
      morning light through a plain window
    wardrobe: 'a t-shirt and shorts or joggers, bare feet — what he already owns. Forbidden:
      shirtless hero shots, compression gear, CrossFit or gym-bro kit, branded activewear,
      and anything that reads as a yoga-studio uniform'
