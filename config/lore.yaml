# Creative lore, one entry per vertical: what this niche IS, and what breaks it.
#
# PORTED, NEVER INVENTED. Ten entries come from fjor-video/config/verticals.yaml,
# which carries them from the client's own META-TEMPLATE_<vertical>_EN.md files;
# `back_pain` and `apostolic_walking` are distilled from the colleague's
# NICHE_TEMPLATES, which fjor-video has no entry for. Nothing here is written from
# imagination, and nothing should be: this is the deepest input the pipeline has,
# and a plausible invention in it outranks the reference and the producer's note.
#
# The four NUTRITION entries (mediterranean_diet, cortisol_diet, biblical_diet,
# intermittent_fasting) are distilled from the colleague's NICHE_TEMPLATES too.
# They carry the rule that most often goes wrong across the two families: a diet
# vertical FORBIDS the time lexicon that an activity vertical REQUIRES.
#
# Three of the ported entries -- lipedema_pilates, yoga_men, bp_walking -- are
# marked in their source as house-pattern EXTRAPOLATION rather than client
# knowledge, written 2026-08-17 from the neighbouring blocks. Treat their
# audience claims, objections and anchors as first drafts to correct against real
# performance; the mechanics, safety blocks and negative tokens are the parts to
# trust. Replace any of them the moment a real meta-template exists.
#
# A VERTICAL IS A THEME, NOT AN IDENTITY (owner rule, 2026-08-04). Every vertical
# here is the angle a general fitness programme is wrapped in. The audience -- and
# the person shown -- is an ordinary adult who wants to get fitter, never a member
# of the profession or patient group the vertical names.
#
# The registry (prefix, folder) lives in verticals.yaml and ONLY there. A vertical
# may be registered with no lore; it simply gets none. A lore entry for a vertical
# nobody registered is refused, because it would never be read.

lore:
  apostolic_walking:
    anchors:
    - no gym, no equipment -- just your shoes and the road
    - walk at a pace where you can still hold a conversation
    - it's not the steps, it's that you never miss a day
    - consistency beats intensity
    - walking is the only exercise I could actually keep doing
    - thirty minutes after Sunday service, every day
    - forty days, forty walks
    cast_lock: 'gender and speaker count preserved absolutely. Default skew female 45-70,
      with men 60+ a legitimate secondary segment -- mirror the reference. TWO typage pools,
      one per creative and never blended: white 50-70 (US, Ireland, Italy, Poland), or Latin-American
      / US-Hispanic 45-65. The expert is NEVER invented and is always a LAYPERSON -- a parish
      or community walking-group leader, 55-70, warm, in a polo shirt or cardigan. A priest,
      pastor, deacon or nun is NEVER the seller, the expert or the face of the offer; third-person
      mention is warm and fine. Body-weight anchoring is the number-one pipeline failure:
      the visual reference is the primary anchor, plus-size stays plus-size, one constant
      weight across all scenes unless there is an explicit result beat, realistic numbers
      (178->144), never a fitness-model transformation'
    content_safety: 'TWO lexical registers, one per creative, NEVER blended. NEUTRAL CHRISTIAN
      is the default: prayer, church, after church, Sunday service, faith, the Lord -- and
      in this register a service is ''Sunday service'', never ''Mass''. The CATHOLIC layer
      switches on only when the brief or the reference hints it, and adds rosary, after
      Mass, my parish, Our Lady, Camino, novena, Lent. Mixing markers from the two camps
      (''my pastor blessed our rosary walk'') is an instant fail -- it tells the audience
      the ad was written by an outsider. HARD STOPS, canon rather than taste: never promise
      divine or miraculous healing; never sell anything ''blessed'', which is simony; never
      use the Pope, saints or miraculous icons as endorsement; never draw an analogy to
      Communion; never frame prayer as a metabolic booster (''each Hail Mary burns X calories''
      is categorically forbidden); never the Way of the Cross as a diet metaphor. The 40-day
      challenge is deliberately NOT tied to Lent -- we run year-round. Jubilee Year 2025
      closed in January 2026 and is DEAD as a live hook; retrospective mention only'
    copy_tone: 'faith is a THIN LAYER, not the subject: two to three touches across the
      WHOLE creative, spread across hook, the bridge into the mechanic, and the CTA. Everything
      else stays in ordinary weight-loss register. Under-do rather than over-do -- a fourth
      and fifth faith line makes it read as a church ad rather than a weight-loss ad. Faith
      must read as ''this was made for me'', never as the topic'
    forbidden_lexicon: '''lymphatic'' is GONE from every spoken line -- the voice model
      mangles it and a science hook fights the faith frame; say puffiness, heaviness, fluid.
      Food-as-mechanic breaks the niche. Gym-bro lexicon. And the faith red lines below,
      which are canon rather than taste'
    forbidden_names: 'no ''Holy Slim'' / ''Blessed Body Walk'' / ''Divine Detox Walk'';
      never combined with the source''s product (''Apostolic Pilates'', ''Lymphatic Apostolic
      Walking''); never mixed with another portfolio (''Apostolic Cortisol'', ''Apostolic
      Daniel Fast''). OWNER DECISION, not to be re-litigated: the product is ''Apostolic
      Walking'' in every scene, chosen knowingly despite the US Pentecostal association.
      Do not quietly substitute a softer word. ONE name per creative, rotated between creatives'
    hook_note: 'one faith identity touch in the hook (''I walked and I prayed''), then ordinary
      register. Social proof is AGE + POUNDS + a faith layer, and there is a verbatim-ready
      library to pull from rather than inventing: improvised faith lines are exactly where
      the tone goes preachy or off-brand'
    keep_out_of_negatives: walking sneakers, a small cross on a chain, a rosary in the hand,
      a wayside shrine
    lipsync_swaps: 'safe aloud -- Camino = kuh-MEE-noh, Santiago = san-tee-AH-goh, rosary
      = ROH-zuh-ree, pilgrimage = PIL-gruh-mij, Guadalupe = gwah-duh-LOO-pay, novena = noh-VEE-nuh,
      apostolic = ap-uh-STOL-ik (verify on the first render; if the voice mangles it, fix
      the pronunciation, do NOT swap the word out). NEVER spoken: lymphatic (removed entirely),
      Francigena, credencial, Compostela, Ultreia, peregrino, albergue'
    locations: a country road or gravel lane in the morning, a footpath, a wayside shrine,
      the OUTSIDE steps of a church, a field in morning light, a quiet residential street
      at dawn, a kitchen table with a mug and a prayer book. NEVER the interior of a church
      during a service, never the altar, never a sanctuary staged as a set for the offer
    mechanic: weight loss through a gentle twenty-to-thirty-minute daily walk, wrapped in
      a pilgrimage and faith frame. Mechanically identical to Lymphatic Walking; the differentiator
      is the FRAME, not the movement. The headline result is always the BODY and the WEIGHT
      -- faith is a layer of meaning and motivation, never the payoff
    moves: 'walking IS the mechanic. Ankle circles, calf stretches and deep breathing only
      as short warm-up or cool-down beats that flow INTO the walk. No jumping, no running,
      no floor exercises, no athletic feats -- it breaks the 50-70 audience''s trust. No
      equipment as a hero prop: no treadmill, no dumbbells, no mat. Prayer while walking
      is a legitimate on-screen beat (rosary in hand, Catholic register only); a person
      standing still in a prayer pose is NOT the mechanic'
    names:
    - Apostolic Walking
    - The 40-Day Apostolic Walk
    - The Apostolic Walking Reset
    - The Apostolic Walking Method
    negative_tokens: gym equipment, dumbbells, treadmill, gym machines, gym-bro aesthetic,
      high-impact jumping, leggings-and-crop-top gym look, bare torso, clerical vestments,
      cassock, clerical collar, nun habit, altar, church interior during service, religious
      icons as endorsement, papal imagery, crucifix close-up as product prop, pilgrim costume
      cosplay, brand logos, fitness-model glam, before-body shaming
    objections: 'keep verbatim -- gym criticism (''gym after fifty? no thanks'', ''cardio
      wrecked my knees''), with the gym kept in BOTH question and answer (answer: gentle
      movement you actually do every day beats intense movement you quit after two weeks).
      THE central objection is ''I already walk every day and nothing changes'' -- every
      viewer thinks she already owns the product, and the answer is pace, regularity and
      intention: ''it''s not the steps, it''s that you never miss a day''. The FAITH objection,
      ''isn''t it strange to mix prayer and losing weight?'', is answered calmly in one
      or two sentences -- the body is a gift, caring for it is a responsibility, prayer
      is what keeps you from quitting -- and never with a theology lecture. Age is a QUALIFICATION,
      not an excuse: ''I''m sixty-three'' / ''Oh, perfect''. NEVER turn the walk into doing
      nothing: ''hasn''t exercised in years'' resolves to ''this is the gentlest place to
      start'''
    palette: WARM -- sand, olive, ochre, muted blue, whitewashed stone, cream linen. Light
      is golden-hour or dawn, soft and diffused. No neon
    power_words: 'REQUIRED time lexicon, an inversion versus the diet templates where it
      is banned: ''thirty minutes a day'', ''every morning'', ''before breakfast'', ''after
      Sunday service''. It IS the offer. Symptom language converts and stays: swollen ankles,
      heavy legs, puffy mornings, tight rings, shoes that don''t fit by afternoon. Faith
      touches: ''I walked and I prayed'', ''I offered up every step'', ''forty days, forty
      walks'''
    prop_language: walking sneakers, a small cross at the neck, a rosary in the hand (Catholic
      register), a wayside shrine, a plain wooden staff if restrained and incidental, a
      modest step counter, a mug and a prayer book at the kitchen table
    wardrobe: 'modest, quiet, ordinary -- four styles: modest domestic (cardigan over a
      blouse, small cross on a chain); walking outdoors (light jacket, comfortable trousers,
      WALKING SNEAKERS, a modest step counter); Sunday-plain for the after-church beats;
      home testimonial in soft cream or sage knit. Walking sneakers are the NORM here, an
      inversion versus the diet templates. Forbidden: the gym look, crop tops, bare torso,
      compression base layers -- and ANY church garment: cassock, clerical collar, nun''s
      habit, vestments. Also forbidden: pilgrim cosplay (wide-brimmed hat, scallop shell
      as costume)'
  back_pain:
    anchors:
    - It's not more stretching -- it's the right ones, in the right order, every day.
    - Strong isn't the same as stable.
    - It's often not where you feel it.
    - You don't need to get fitter -- you need to stop the thing that keeps re-injuring
      you.
    - It's not in your head, and it's not just age.
    - Without drugs or surgery.
    - I stopped waiting for someone to fix me.
    - Five minutes, before you even get out of bed.
    cast_lock: 'the gender split is EVEN -- a male speaker is exactly as normal as a female
      one, unlike the lymph verticals. Never feminise or masculinise it. Default 40-55 with
      a deliberately wide spread, from office millennials who sit all day through to 65+.
      Western, real people. The transformation arc is POSTURE AND MOBILITY, never fat: before
      is hunched, a hand on the lower back, easing down into a chair; after is standing
      straight, bending freely, picking up a grandchild. Never a bathroom scale in frame.
      Preserve exact ages and the YEARS OF PAIN verbatim -- ''six years'', ''twelve years''
      are this niche''s equivalent of the weight number'
    content_safety: 'THE EXPERT IS NEVER INVENTED. No authority figure in the reference
      -- a street interview, two friends, pure UGC -- means NO expert at all and no competence
      markers added. Where one exists, give at most one or two modest markers that fit the
      scene (a spine model or poster on a podcast set, a rolled mat, a polo shirt, demonstrating
      on their own body) and at most ONE line such as ''I''ve worked with backs for twenty
      years''. FORBIDDEN always, even in an office: a white coat, a stethoscope, scrubs,
      a diploma wall, a clinic, and the word ''doctor'' for our expert -- we sell exercises,
      a physician is not needed here'
    copy_tone: 'the viewer came to STOP THE PAIN, not to improve her body. Never a drill
      sergeant, never gym-bro, never a pseudo-medical guru. No safety gating of any kind:
      no invented age limits, contraindication lists, red-flag warnings or ''who this is
      not for'' blocks -- it is an ad, and the funnel takes it from there'
    forbidden_lexicon: 'WEIGHT, in any form -- this template overrides the portfolio rule
      that the headline result is the body. No scale, no dress size, no belly fat, no before/after
      body; a weight result in the source is rewritten into FUNCTION (''I dropped two sizes''
      -> ''I can bend over without that stab''). Also forbidden: gym-bro (burn, shred, no
      pain no gain, six-pack, HIIT); food-as-mechanic; and cure/outcome claims (cure, heal
      your herniated disc, reverse degenerative disc disease, pain gone forever, replace
      surgery) which Meta and the FTC pull. A PERSONAL story is not a product promise: ''I
      cancelled my surgery'' and ''I got off the pills'' are allowed without restriction
      and are the strongest proof here'
    forbidden_names: no 'Spine Blaster' / 'Back Fix Extreme' / 'Miracle Back Cure'; never
      combined with the source's product ('Pilates Back Relief', '9-minute Back Pain Relief');
      never mixed with another portfolio ('Mediterranean Back Relief'). ONE name in every
      scene of one creative, rotated between creatives
    hook_note: 'FIRST PERSON, always -- the speaker''s own pain story, preserved as STRUCTURE.
      The hook may NOT ask about the viewer''s health: ''Do you suffer from sciatica?''
      is auto-flagged by Meta as a personal attribute, while ''I had back pain for twelve
      years'' passes clean. Social proof is AGE + YEARS OF PAIN + WHAT SHE CAN DO NOW'
    keep_out_of_negatives: mat, chair, towel, foam roller, wall, doorway
    lipsync_swaps: 'the voice model mangles clinical terms -- never SPEAK lumbar (say ''lower
      back''), herniated disc (''a disc issue''), piriformis (''the muscle deep in your
      glute''), sacroiliac (''S-I joint''), stenosis (''narrowing in the spine''), iliopsoas
      (''hip flexor''), vertebrae (''the bones in your back''), coccyx (''tailbone''); do
      not voice spondylolisthesis at all. All of them are fine as ON-SCREEN TEXT. ''sciatica''
      IS approved aloud and is the best-selling word of the vertical: sy-AT-ih-kuh; ''sciatic
      nerve'' = sy-AT-ik NERVE; ''S-I joint'' = ess-EYE joint'
    locations: a living room with a mat, a bedroom in morning light, the edge of the bed,
      a kitchen with the counter as a support, a hallway or doorway, the back yard, an office
      desk for the sitting-all-day character. Never a mirrored gym hall, a weight room,
      a CrossFit box or a clinical exam room
    mechanic: a home programme of gentle exercises that unload and strengthen the back --
      five to fifteen minutes a day, on a mat, on a chair or against a wall
    moves: 'decompression (prone press-up, child''s pose, doorway decompression, 90/90 breathing),
      mobility (cat-cow, knee-to-chest, seated rotation, hip flexor stretch, thoracic rotation),
      core and glute (glute bridge, dead bug, bird dog, side plank, modified curl-up --
      the McGill Big 3, the recognisable ''science'' block of the niche), nerve glides (sciatic
      flossing), posture (wall angels, chin tuck, pelvic tilt). Chair and wall variants
      are attractive and normal, framed as CONVENIENCE (''you can do it holding the kitchen
      counter'') and never as an age limit. No high-impact jumping, no running, no loaded
      lifting, no advanced yoga pretzels -- they break belief for someone whose back hurts
      right now. The exercise STAYS: only the modality changes, and it never becomes doing
      nothing'
    names:
    - Back Pain Relief
    - 28-Day Back Relief Challenge
    - The Back Relief Reset
    - The Back Relief Method
    negative_tokens: dumbbells, barbells, gym machines, CrossFit gear, treadmill, mirrored
      gym, bare torso, bathroom scale, before/after body shaming, white lab coat, stethoscope,
      clinical exam room, diploma wall, brand logos, fitness-model glam, high-impact jumping,
      golden Mediterranean haze
    objections: 'keep verbatim -- gym and hard-cardio criticism, with the compared thing
      kept in BOTH question and answer (answer: ''strong isn''t the same as stable -- the
      gym loads the exact thing that already hurts''). THE CENTRAL OBJECTION of the niche
      is ''I''ve already tried stretching / physio gave me a sheet'', and the answer is
      never more stretching: it is the order, the daily rhythm, and what keeps loading the
      back in between. Also: the doctor who only gave painkillers; ''my scan showed a disc
      issue, how can stretching fix that?'' -> ''it''s often not where you feel it''; fear
      of making it worse; cortisone that wore off; the surgeon proposing a fusion; the chiropractor
      at eighty dollars a visit; YouTube stretches that made it worse; ''it''s just old
      age''; and ''no time or energy'', which the time lexicon answers. NEVER turn this
      into doing nothing -- ''hasn''t worked out in years'' resolves to ''this is the gentlest
      place to start'', never to ''she doesn''t need to''. Tone toward doctors is not anti-medical:
      it is taking it into your own hands'
    palette: WARM AND DOMESTIC -- milky white, warm grey, light wood, soft morning light,
      muted accents. No neon, no clinical cold white, no golden Mediterranean haze
    power_words: 'lower back pain, sciatica, shooting pain down my leg, pins and needles,
      pinched nerve, a disc issue, slipped disc, S-I joint, flare-up, my back went out,
      stiff when I get out of bed, couldn''t tie my shoes, can''t put my socks on, sitting
      all day, spasms, locked up, it never fully goes away, on and off for years. Use 25-35
      of these verbatim across a creative -- this is what makes the viewer say ''that''s
      me''. REQUIRED time lexicon, an inversion versus the diet templates where it is forbidden:
      ''just five minutes a day'', ''before you even get out of bed'', ''no gym, no equipment'''
    prop_language: a mat in the living room, an ordinary armless chair, a wall, a doorway,
      a towel under the head or knees, a pillow, the kitchen counter, the edge of the bed,
      a rug, socks, a morning coffee mug, a foam roller -- hero props
    wardrobe: 'four styles -- morning-at-home (T-shirt, loose soft trousers or pyjama bottoms,
      socks: the signature look of the ''before you get out of bed'' beat); casual outdoor;
      office-casual for the millennial character; comfortable athleisure that is NOT a gym
      look. Forbidden: gym and CrossFit kit, compression performance wear, crop tops, bare
      torso'
  biblical_diet:
    anchors: []
    cast_lock: Christian women 50+, American or Western European. No East Asian features
      on the main customer -- a carry-over from Asian Pilates sources
    content_safety: 'the faith red lines of the apostolic vertical apply in spirit: no divine
      or miraculous healing promise, nothing sold as blessed, no clergy as the face of the
      offer, no scripture used as a metabolic claim'
    copy_tone: warm and reverent without preaching; faith is the frame, food is the mechanic,
      and weight is the result
    forbidden_lexicon: 'ZERO TIME-BASED LEXICON. Any phrase expressing the product as a
      time activity -- ''X minutes a day'', ''a X-minute routine'', ''just N minutes'' --
      is categorically forbidden, even freshly written and even phrased differently from
      the reference. A diet is WHAT you eat, not how long you spend, and a minute-based
      claim sounds identical to the exercise niches. Replace with FREQUENCY: ''daily'',
      ''with every meal'', ''every morning'', ''three simple meals a day''. Single exception:
      an explicit MEAL-PREP time (''a 20-minute pasta dinner'') is about cooking, not the
      programme -- and is still better rephrased. This is the exact INVERSE of the activity
      verticals, where the time lexicon is required and central'
    forbidden_names: never combined with the source's product name; ONE name per creative,
      rotated between
    hook_note: mirror the reference's hook structure
    keep_out_of_negatives: olives, figs, bread, honey, fish
    locations: ordinary Western domestic settings with a warm Holy-Land food palette. Never
      church-altar staging
    mechanic: 'eating the way scripture describes -- olives, figs, bread, grapes, honey,
      fish -- re-framed around faith. The foods overlap heavily with Mediterranean and that
      is expected: the differentiator is the FAITH FRAME, not the food. Unlike Cortisol,
      this niche is NOT anti-Mediterranean'
    moves: 'none: this is a food vertical'
    names:
    - Biblical Diet
    - Biblical Eating
    - the Biblical way of eating
    - 30-day Biblical Challenge
    - Biblical Reset
    negative_tokens: gym equipment, yoga mats, pilates props, exercise gear, dumbbells,
      workout machines, athletic studio aesthetic, East Asian features on the main customer,
      Middle-Eastern costume, ancient-Israel cosplay, large dominant crosses, church-altar
      staging, clergy robes, overly muscular fitness instructor body type, brand logos
    objections: mirror the reference's beats; the faith objection is answered calmly and
      briefly, never with a theology lecture
    palette: warm Holy-Land food tones
    power_words: biblical foods, the way they ate, olives, figs, honey, bread, fish, real
      food from scripture
    prop_language: olives, figs, grapes, honey, bread, fish, a plain table
    wardrobe: ordinary modern clothing. NO Middle-Eastern costume or ancient-Israel cosplay,
      no clergy robes
  bp_walking:
    anchors:
    - Twenty minutes, most days. That's the whole thing.
    - Easy enough to hold a conversation.
    - You don't need a gym, a plan or new shoes.
    - It's the walk you'll actually keep doing.
    - Alongside whatever your doctor already has you on.
    - Start at the end of the street.
    cast_lock: mixed, and skewing older than most verticals — real adults 50-70, both men
      and women, ordinary builds. Couples and neighbours walking together read well here.
      Never fitness models, never anyone depicted as frail, ill or mid-diagnosis
    content_safety: 'OUTRANKS EVERYTHING, INCLUDING THE PRODUCER''S NOTE, AND THIS IS THE
      STRICTEST BLOCK IN THIS FILE. Hypertension is a diagnosed, medicated condition. (1)
      NEVER claim or imply that walking lowers blood pressure, treats, reverses, manages
      or cures hypertension. The only permitted framing is general wellbeing and heart-healthy
      movement: "supports an active lifestyle", "movement your doctor already recommends",
      "alongside your care". (2) NEVER suggest, imply or depict reducing, skipping or stopping
      medication, and never frame the programme as an alternative to it. If an objection
      touches medication, the answer is "alongside it — talk to your doctor". (3) NO NUMBERS.
      No BP readings on screen or in speech, no before/after readings, no "down from 150
      to 130". A number turns wellbeing copy into a clinical claim in one frame. (4) NO
      FEAR. No stroke, heart attack, "silent killer" or mortality framing; this audience
      is frightened enough and fear-selling a medical condition is not something we do.
      (5) No clinical imagery (cuffs, monitors, pills, clinicians) — see negative_tokens
      — and a "talk to your doctor before starting" line in the bottom safe zone on EVERY
      creative, not just the ones that mention health.'
    copy_tone: calm, plain, unhurried and reassuring — the tone of sensible advice from
      someone who is not selling you a miracle. Never urgent, never alarming, never triumphant.
      The lowest-friction offer we have; say so plainly
    forbidden_lexicon: 'food-as-mechanic; gym-bro (reps, burn, HIIT, shred); and ABSOLUTELY
      any of: lower your blood pressure, drop your numbers, reverse hypertension, get off
      your meds, reduce your medication, cure, treat, fix, natural alternative to pills.
      Also avoid fear words — stroke, heart attack, silent killer, ticking time bomb'
    forbidden_names: no 'BP Blaster', 'Pressure Drop', 'Beat Hypertension' or any name that
      promises a clinical outcome; nothing with a NUMBER in it ('120/80 Method'); never
      combined with the source's product; no 'Extreme'/'Blast'/'Shred'
    hook_note: HABIT-FIRST — open on the walk being easy and keepable ('twenty minutes,
      most days'), or on the everyday feeling of being told to move more. NEVER open on
      a number, a diagnosis, a symptom or a scare
    keep_out_of_negatives: walking shoes, front door, park path, bench, plain watch
    lipsync_swaps: say 'your numbers' rather than 'blood pressure' inside a spoken line
      where the sentence allows, 'a steady walk' not 'aerobic exercise', 'your doctor' not
      'physician'. Keep 'Blood Pressure' visual-only where it can be — the spoken register
      should sound like a neighbour, not a leaflet
    locations: a neighbourhood pavement, a park loop, a quiet lane in early morning or evening
      light, a seafront path, a shopping-centre concourse in bad weather. Ordinary places
      within walking distance of a front door
    mechanic: steady rhythmic walking at an easy conversational pace — one walk a day, about
      twenty minutes, most days of the week
    moves: a steady conversational-pace walk as the hero, with a slow first minute and an
      easy last minute as the warm-up and cool-down. NEVER running, intervals, hills as
      a challenge, or anything that would leave the walker breathless
    names:
    - Blood Pressure Walking
    - The Daily Walk Method
    - 28-Day Walking Challenge
    - The 20-Minute Walk Habit
    - Walking for a Healthier Heart
    negative_tokens: blood-pressure cuff, sphygmomanometer, monitor readout, any numeric
      BP reading, pill bottles, pill organisers, medication, doctors, nurses, stethoscopes,
      clinics, hospitals, charts or graphs of readings, anatomical heart diagrams, red alarm
      colouring, distressed or clutching-chest imagery, dumbbells, gym machines, food as
      hero prop, brand logos, fitness-model glam, running, before-body shaming
    objections: 'keep verbatim — the gym and hard-exercise criticism (''I''m not running
      at my age'', ''the gym is not for me''). Vertical-specific: ''I already walk and nothing
      changes'' (answer on pace, duration and consistency, never on doing more), ''my doctor
      already told me to exercise'' (answer: this is how you keep doing it), ''I''m on medication''
      (answer: this sits alongside it — talk to your doctor, never instead of), ''I get
      out of breath'', ''my knees''. NEVER script an objection whose answer is to change
      or stop medication'
    palette: calm daylight — soft green, sky grey-blue, warm stone, muted navy. Ordinary
      weather and ordinary streets. Avoid clinical white-and-blue, avoid red (it reads as
      alarm here), avoid golden-hour glamour
    power_words: steady, easy pace, conversational, twenty minutes, most days, a habit you
      keep, heart-healthy movement, supports, day by day, doctor-friendly
    prop_language: comfortable everyday shoes, a front door, a park path, a lamppost or
      bench as a turnaround marker, a plain watch. NEVER a blood-pressure cuff, a monitor,
      a pill organiser or a chart of readings
    wardrobe: 'everyday clothes and comfortable shoes — a jacket, trousers or joggers, whatever
      he or she already owns. Forbidden: gym-bro and CrossFit gear, running kit, heart-rate
      straps, medical wearables, hospital settings'
