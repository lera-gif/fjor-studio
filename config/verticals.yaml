# Vertical registry: the id prefix a job's creative id is built from, and the
# folder its finals are delivered into.
#
# Both are LIVE conventions, read off the delivery tree (delivery.yaml `root`)
# and fjor-video's own registry. Folder names are exact, including the spaces --
# they are existing directories on disk, not names we get to choose.
#
# An unknown vertical is refused at INTAKE, where nothing has been paid for yet.
# By delivery the creative is built and paid for, so the lookup there is
# non-strict and falls back to the raw name rather than stranding finished files.

verticals:
  menopause_yoga:   {prefix: MENY,  folder: "MENOPAUSE YOGA"}
  yoga:             {prefix: "Y",   folder: "YOGA"}
  yoga_men:         {prefix: YM,    folder: "YOGA FOR MEN"}
  pilates:          {prefix: PIL,   folder: "PILATES"}
  lipedema_pilates: {prefix: LIPIL, folder: "LIPEDEMA PILATES"}
  military:         {prefix: MIW,   folder: "MILITARY WORKOUT"}
  lymph_exercise:   {prefix: LME,   folder: "LYMPH EXERCISE"}
  lymph_walking:    {prefix: LW,    folder: "LYMPH WALKING"}
  bp_walking:       {prefix: BPW,   folder: "BLOOD PRESSURE WALKING"}
  lymph_massage:    {prefix: LMM,   folder: "LYMPH MASSAGE"}
  # Added with the colleague's v4 niches. BPR is not a name we chose: twenty
  # creatives have already shipped under it into BACK PAIN RELIEF, and an id
  # allocated against that folder has to agree with them.
  back_pain:        {prefix: BPR,   folder: "BACK PAIN RELIEF"}
  apostolic_walking: {prefix: APW,  folder: "APOSTOLIC WALKING"}
  # New for testing, 2026-09-02. SL is the LIVE prefix, corrected by the owner
  # the same day -- SLS was mine and wrong. The folder does not exist on the
  # delivery tree yet; `delivery` creates it on the first finished creative.
  strong_legs:      {prefix: SL,    folder: "STRONG LEGS"}

  # ── NUTRITION ─────────────────────────────────────────────────────────────
  # Added 2026-09-02 for the nutrition producers, who work from the share copy.
  # Every vertical above is ACTIVITY; these four are the first food ones, and
  # the pipeline treats them no differently -- only their lore does.
  #
  # Prefixes confirmed by the owner 2026-09-02; the folder names are the product
  # names from the colleague's own templates. R is for biblical_diet because the
  # colleague's tool calls that niche `religion` -- the prefix follows the niche,
  # not the product name, and an id reader needs to know that.
  mediterranean_diet:   {prefix: "M",  folder: "MEDITERRANEAN DIET"}
  cortisol_diet:        {prefix: COR,  folder: "CORTISOL DIET"}
  biblical_diet:        {prefix: "R",  folder: "BIBLICAL DIET"}
  intermittent_fasting: {prefix: IF,   folder: "INTERMITTENT FASTING"}
